<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EnergInAI Report</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="wrap login">
    <div class="brand">
      <h1>EnergInAI</h1>
      <p>Energy Report Generator</p>
    </div>
    <form class="card" method="post" action="/login">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" id="toggle" class="eye" aria-label="Show password" aria-pressed="false">
            <svg id="eye-on" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eye-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button type="submit">Log in</button>
      <div class="msg err" id="err" style="display:none">Incorrect username or password.</div>
    </form>
  </div>
  <script>
    const pw = document.getElementById("password");
    const toggle = document.getElementById("toggle");
    toggle.addEventListener("click", () => {
      const show = pw.type === "password";
      pw.type = show ? "text" : "password";
      toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
      toggle.setAttribute("aria-pressed", String(show));
      document.getElementById("eye-on").style.display = show ? "none" : "";
      document.getElementById("eye-off").style.display = show ? "" : "none";
      pw.focus();
    });
    const err = document.getElementById("err");
    if (location.search.includes("error=1")) err.style.display = "block";
    if (location.search.includes("error=2")) {
      err.textContent = "Too many failed attempts. Please try again in 15 minutes.";
      err.style.display = "block";
    }
  </script>
</body>
</html>
